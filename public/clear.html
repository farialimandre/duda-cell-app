<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Limpando...</title>
<style>body{background:#0A0A0A;color:#C9A86A;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}</style>
</head>
<body>
<div>
<h2>Limpando cache velho...</h2>
<p id="status">Aguarde...</p>
</div>
<script>
(async function(){
  const status = document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(let r of regs){ await r.unregister(); }
      status.textContent = regs.length + ' Service Workers removidos!';
    }
    if('caches' in window){
      const keys = await caches.keys();
      for(let k of keys){ await caches.delete(k); }
    }
    localStorage.clear();
    sessionStorage.clear();
    status.textContent = 'Cache limpo! Redirecionando...';
    setTimeout(()=>{ window.location.href='/?limpo='+Date.now(); }, 1000);
  }catch(e){
    status.textContent = 'Erro: '+e.message;
    setTimeout(()=>{ window.location.href='/'; }, 2000);
  }
})();
</script>
</body>
  </html>
